<title>BRAVÍO Commercial Landscape | Texas Sabal palms, South Texas</title>
<meta name="description" content="BRAVÍO Commercial Landscape supplies, installs and relocates Texas Sabal palms, the native palm of the Rio Grande Valley, for commercial projects across South Texas. Coming spring 2027.">

<style>
:root{--bone:#F3EEE2;--ink:#111210;--stone:#5E5B52;--field:#2E5A3B;--display:"Archivo","Arial Black",Arial,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--bone);color:var(--ink);font:18px/1.55 var(--body);display:grid;grid-template-rows:1fr auto auto;text-align:center}
main{align-self:center;justify-self:center;width:100%;max-width:820px;padding:clamp(36px,7vh,80px) clamp(20px,5vw,48px) clamp(20px,4vh,40px);display:grid;justify-items:center}
.logo{margin:0;line-height:0}
.logo img{width:min(88vw,520px);height:auto;display:block}
.native{font:700 clamp(11px,1.5vw,13px)/1.4 var(--display);letter-spacing:.3em;text-transform:uppercase;color:var(--field);margin:clamp(22px,4vh,36px) 0 0}
.soon{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(14px,3vw,28px);width:100%;margin:clamp(14px,3vh,24px) 0}
.soon::before,.soon::after{content:"";height:3px;background:var(--ink)}
.soon b{font:900 clamp(34px,8.5vw,84px)/.95 var(--display);font-stretch:118%;letter-spacing:-.015em;text-transform:uppercase;white-space:nowrap}
.soon small{display:block;font:700 clamp(11px,1.6vw,14px)/1 var(--display);letter-spacing:.42em;text-transform:uppercase;margin:0 0 10px .42em;color:var(--stone)}
.lede{font-size:clamp(17px,2.1vw,20px);line-height:1.5;max-width:40ch;margin:0;text-wrap:balance}
.contact{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 32px;margin-top:clamp(20px,4vh,32px)}
.contact a{font:800 clamp(18px,2.6vw,24px)/1.3 var(--display);color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;overflow-wrap:anywhere}
.contact a:hover{color:var(--field)}
a:focus-visible{outline:3px solid var(--field);outline-offset:4px}
.skyline{display:block;width:100%;height:auto;max-height:30vh;color:var(--ink)}
footer{background:var(--ink);color:var(--bone);padding:14px 20px;font-size:13.5px;letter-spacing:.04em}
</style>
</head>
