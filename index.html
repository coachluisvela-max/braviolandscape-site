<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRAVÍO Commercial Landscape | Texas Sabal palms, South Texas</title>
<meta name="description" content="BRAVÍO Commercial Landscape supplies, installs and relocates Texas Sabal palms for commercial projects in South Texas. Booking installations for spring 2027.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Public+Sans:wght@400;500&display=swap">
<style>
:root{--bone:#F3EEE2;--ink:#111210;--stone:#5E5B52;--field:#2E5A3B;--display:"Archivo","Arial Black",Arial,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bone);color:var(--ink);font:18px/1.55 var(--body);display:grid;grid-template-rows:1fr auto;padding:0 clamp(20px,6vw,72px)}
main{align-self:center;max-width:900px;padding-block:48px}
.logo{margin:0;line-height:0}
.logo img{width:min(100%,680px);height:auto;display:block;margin-left:-3.5%}
.rule{width:72px;height:6px;background:var(--ink);margin:clamp(28px,5vw,48px) 0}
p{margin:0 0 12px;max-width:44ch}
.lede{font-size:clamp(19px,2.4vw,24px);line-height:1.4}
.soon{color:var(--field);font-weight:500}
.contact{display:flex;flex-wrap:wrap;gap:10px 36px;margin-top:clamp(24px,4vw,40px)}
.contact a{font:800 clamp(20px,3vw,30px)/1.2 var(--display);color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;overflow-wrap:anywhere}
.contact a:hover{color:var(--field)}
a:focus-visible{outline:3px solid var(--field);outline-offset:4px}
footer{padding-block:20px;font-size:14px;color:var(--stone)}
</style>
</head>
<body>
<main>
  <h1 class="logo"><img src="logo.svg" alt="BRAVÍO Commercial Landscape"></h1>
  <div class="rule"></div>
  <p class="lede">Texas Sabal palms supplied, installed and relocated for commercial projects across South Texas.</p>
  <p class="soon">Full site coming soon. Booking installations for spring 2027.</p>
  <div class="contact">
    <a href="tel:+19563222640">(956) 322-2640</a>
    <a href="mailto:info@braviolandscape.com">info@braviolandscape.com</a>
  </div>
</main>
<footer>BRAVÍO Commercial Landscape LLC · McAllen, Texas</footer>
</body>
</html>
